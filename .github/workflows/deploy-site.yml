name: Deploy website

# Builds the combined site bundle and publishes it to GitHub Pages.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Docs and mobile app changes do not affect the published website bundle.
    paths-ignore:
      - "**.md"
      - "mobile/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keep one in-flight deployment; newer pushes supersede older ones.
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build:site

      - name: Keep underscore-prefixed files in artifact
        run: touch dist-site/.nojekyll

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
