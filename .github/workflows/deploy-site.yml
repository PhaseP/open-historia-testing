name: Deploy website

# Builds the website and publishes it on every push to main, so the site is
# never behind the code. Also runnable on demand from the Actions tab.
#
# A happy side effect: CI is the one place the map-binary trap cannot fire. The
# pmtiles are gitignored and only ever arrive from the map-data Release, so a
# runner never has them, and `build:site` cannot sweep 160MB of them into the
# site the way it can on a machine that has actually played the game.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Docs and the mobile app can't change what the site serves; skip the build
    # rather than spend minutes rebuilding an identical bundle.
    paths-ignore:
      - "**.md"
      - "mobile/**"
      - ".github/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A push while a deploy is running should supersede it, not race it onto the
  # live domain in whatever order the two happen to finish.
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24 (Active LTS). Node 20 is end-of-life, and wrangler 4 — what
          # wrangler-action@v4 installs by default — needs Node 22 or newer.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        # Landing page at /, game at /play/. seed-web-defaults.mjs reads the
        # default scenario out of server/data, which IS committed, so this needs
        # nothing from the map-data Release.
        run: npm run build:site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
